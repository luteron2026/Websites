<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>%TITLE%</title>
<!--HEAD-->
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <span class="eyebrow">Prepared for</span>
      <span class="client-name" id="clientName"></span>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Website options</h1>
      <p class="intro" id="intro"></p>
      <p class="count" id="count"></p>
    </section>
    <div class="grid" id="grid"></div>
  </main>

  <div class="viewer" id="viewer" hidden aria-modal="true" role="dialog" aria-label="Website preview">
    <div class="bar">
      <button class="btn ghost" id="close" aria-label="Back to all options">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
        <span>All options</span>
      </button>
      <nav class="tabs" id="tabs" aria-label="Options"></nav>
      <div class="devices" role="group" aria-label="Screen size">
        <button data-device="desktop" aria-label="Desktop" title="Desktop" aria-pressed="true">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5" /><path d="M8 20h8M12 16v4" /></svg>
        </button>
        <button data-device="tablet" aria-label="Tablet" title="Tablet" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" /><path d="M11 18h2" /></svg>
        </button>
        <button data-device="phone" aria-label="Phone" title="Phone" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="7.5" y="3" width="9" height="18" rx="2" /><path d="M11 18h2" /></svg>
        </button>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="device" id="device"><iframe id="frame" title="Website preview"></iframe></div>
    </div>
  </div>

  <script>window.SHOWCASE = { page: 'client', data: /*DATA*/null }</script>
  <!--SCRIPT-->
</body>
</html>
